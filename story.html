<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小问号科学周刊——故事详情">
  <title>故事详情 - 小问号科学周刊</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" width="42" height="42">
        <circle cx="25" cy="25" r="24" fill="#FF9A56"/>
        <ellipse cx="18" cy="22" rx="14" ry="12" fill="#FFF8E7"/>
        <polygon points="10,16 4,8 20,8 22,16" fill="#FF9A56"/>
        <polygon points="18,16 12,8 28,8 30,16" fill="#FF9A56"/>
        <circle cx="14" cy="19" r="3.5" fill="#4A3728"/>
        <circle cx="24" cy="19" r="3.5" fill="#4A3728"/>
        <ellipse cx="19" cy="26" rx="6" ry="3.5" fill="#4A3728"/>
      </svg>
      小问号科学周刊
    </a>
    <nav class="nav-links">
      <a href="index.html">故事宝箱</a>
      <a href="story.html?id=1">看故事</a>
      <a href="letter.html">我想写信</a>
      <a href="about.html">关于我们</a>
    </nav>
  </div>
</header>

<main class="page-container">

  <!-- 返回 -->
  <a href="index.html" class="btn-back">← 回到故事宝箱</a>

  <!-- 故事头部 -->
  <div class="story-header" id="storyHeader">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 大幅插画 -->
  <div class="story-illustration" id="storyIllustration">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 听故事控制栏 -->
  <div class="listen-bar">
    <button class="btn-listen" id="btnListen">
      <span class="icon">🔊</span> 听故事
    </button>
    <div class="listen-speed">
      <button class="speed-btn" data-rate="0.7">0.7x</button>
      <button class="speed-btn active" data-rate="1.0">1.0x</button>
      <button class="speed-btn" data-rate="1.3">1.3x</button>
    </div>
  </div>

  <!-- 正文 -->
  <article class="story-content" id="storyContent">
    <!-- JS 动态渲染 -->
  </article>

  <!-- 故事导航（上下篇） -->
  <nav class="story-nav" id="storyNav">
    <!-- JS 动态渲染 -->
  </nav>

  <!-- Q&A -->
  <section class="qa-section" id="qaSection">
    <h3>✨ 今天学到了什么？</h3>
    <div class="qa-cards" id="qaCards">
      <!-- JS 动态渲染 -->
    </div>
  </section>

  <!-- 留言区 -->
  <section class="comments-section">
    <h3>💌 给讲故事的哥哥姐姐留言</h3>
    <div class="comment-form">
      <div class="emoji-picker" id="emojiPicker">
        <span class="emoji-option" data-emoji="😊">😊</span>
        <span class="emoji-option" data-emoji="🌟">🌟</span>
        <span class="emoji-option" data-emoji="❤️">❤️</span>
        <span class="emoji-option" data-emoji="👍">👍</span>
        <span class="emoji-option" data-emoji="🦊">🦊</span>
        <span class="emoji-option" data-emoji="🌈">🌈</span>
      </div>
      <textarea id="commentInput" placeholder="想对哥哥姐姐说什么呢？"></textarea>
      <button class="btn-send" id="btnSend">✉️ 发送留言</button>
    </div>
    <div id="commentsList">
      <!-- JS 动态渲染 -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>用温暖的科学故事，陪伴每一个孩子认识世界 <span class="heart">♥</span></p>
  <p>小问号科学周刊 · 大学生志愿者公益项目</p>
</footer>

<script src="js/stories.js"></script>
<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script src="js/story-detail.js"></script>
</body>
</html>
