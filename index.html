<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小问号科学周刊——用温暖的科学故事，陪伴留守儿童认识世界的线上周刊">
  <title>小问号科学周刊</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
        <circle cx="25" cy="25" r="24" fill="#FF9A56"/>
        <ellipse cx="18" cy="22" rx="14" ry="12" fill="#FFF8E7"/>
        <polygon points="10,16 4,8 20,8 22,16" fill="#FF9A56"/>
        <polygon points="18,16 12,8 28,8 30,16" fill="#FF9A56"/>
        <circle cx="14" cy="19" r="3.5" fill="#4A3728"/>
        <circle cx="24" cy="19" r="3.5" fill="#4A3728"/>
        <ellipse cx="19" cy="26" rx="6" ry="3.5" fill="#4A3728"/>
      </svg>
      小问号科学周刊
    </a>
    <nav class="nav-links">
      <a href="index.html">故事宝箱</a>
      <a href="story.html?id=1">看故事</a>
      <a href="letter.html">我想写信</a>
      <a href="about.html">关于我们</a>
    </nav>
  </div>
</header>

<main class="page-container">

  <!-- Hero -->
  <section class="hero">
    <div class="hero-mascot">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="#FF9A56"/>
        <ellipse cx="38" cy="44" rx="28" ry="24" fill="#FFF8E7"/>
        <polygon points="22,34 10,18 42,18 44,34" fill="#FF9A56"/>
        <polygon points="38,34 26,18 58,18 60,34" fill="#FF9A56"/>
        <rect x="28" y="38" width="24" height="5" rx="2.5" fill="#5BA4BF" opacity="0.7"/>
        <circle cx="30" cy="40" r="6" fill="#4A3728"/>
        <circle cx="50" cy="40" r="6" fill="#4A3728"/>
        <circle cx="33" cy="36" r="2" fill="#FFF"/>
        <circle cx="53" cy="36" r="2" fill="#FFF"/>
        <ellipse cx="40" cy="52" rx="10" ry="6" fill="#4A3728"/>
        <text x="40" y="82" font-size="16" fill="#4A3728" font-weight="bold">？</text>
      </svg>
    </div>
    <h1>小问号科学周刊</h1>
    <p class="subtitle">你好呀，我是小狐狸问问 🦊 让我带你去看世界！</p>
    <p class="tagline">每周一个科学小故事 · 陪你认识这个奇妙的世界</p>
  </section>

  <!-- 切换标签 -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="read">
      <span class="tab-icon">📖</span> 看故事
    </button>
    <button class="tab-btn" data-tab="listen">
      <span class="tab-icon">🎧</span> 听故事
    </button>
  </div>

  <!-- 看故事：卡片网格 -->
  <div id="tab-read" class="stories-grid">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 听故事：音频列表 -->
  <div id="tab-listen" class="audio-list hidden">
    <!-- JS 动态渲染 -->
  </div>

</main>

<footer class="site-footer">
  <p>用温暖的科学故事，陪伴每一个孩子认识世界 <span class="heart">♥</span></p>
  <p>小问号科学周刊 · 大学生志愿者公益项目</p>
</footer>

<script src="js/stories.js"></script>
<script src="js/main.js"></script>
<script>
(function() {
  const grid = document.getElementById('tab-read');
  const list = document.getElementById('tab-listen');

  // 渲染故事卡片
  STORIES.forEach(s => {
    grid.insertAdjacentHTML('beforeend', renderStoryCard(s));
  });

  // 渲染音频列表
  STORIES.forEach(s => {
    list.insertAdjacentHTML('beforeend', `
      <div class="audio-item" data-story-id="${s.id}" onclick="location.href='story.html?id=${s.id}&mode=listen'">
        <div class="audio-play-btn">▶</div>
        <div class="audio-info">
          <h4>${s.title}</h4>
          <div class="meta">${s.tag} · ${s.stars} 人听过</div>
        </div>
        <span style="font-size:0.85rem;color:var(--text-muted)">${Math.floor(s.content.join('').length / 200)}分钟</span>
      </div>
    `);
  });

  // 切换标签
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      const tab = this.dataset.tab;
      grid.classList.toggle('hidden', tab !== 'read');
      list.classList.toggle('hidden', tab !== 'listen');
    });
  });
})();
</script>
</body>
</html>
