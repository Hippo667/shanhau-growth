<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山花成长记 - 支教孩子成长记录</title>
<script src="supabase.min.js"></script>
<style>
:root {
  --primary: #E8915C; --primary-dark: #D4784A; --primary-light: #FFF0E8;
  --green: #5B9A6B; --green-light: #E8F5EC; --blue: #5B7F9A; --blue-light: #E8F0F8;
  --yellow: #E8C75B; --yellow-light: #FFFBE8; --bg: #FAF7F2; --card: #FFFFFF;
  --text: #3D3530; --text-secondary: #8C8078; --border: #E8E0D8;
  --shadow-sm: 0 1px 3px rgba(61,53,48,0.08); --shadow: 0 4px 16px rgba(61,53,48,0.10);
  --shadow-lg: 0 8px 32px rgba(61,53,48,0.12); --radius: 16px; --radius-sm: 10px;
  --sidebar-w: 220px; --header-h: 64px; --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
/* ===== Auth Page ===== */
.auth-page {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #FFF0E8 0%, #FAF7F2 30%, #E8F5EC 70%, #E8F0F8 100%);
  padding: 20px; position: relative; overflow: hidden;
}
.auth-container { position: relative; z-index: 1; width: 100%; max-width: 440px; }
.auth-header { text-align: center; margin-bottom: 28px; }
.auth-header .logo { font-size: 48px; margin-bottom: 8px; }
.auth-header h1 { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.auth-header p { font-size: 14px; color: var(--text-secondary); }
.auth-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 32px 28px; }
.auth-tabs { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
.auth-tab {
  flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all var(--transition); border: none; background: none; color: var(--text-secondary); text-align: center;
}
.auth-tab.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-form .form-group { margin-bottom: 16px; }
.auth-form .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.auth-form .form-input, .auth-form .form-select {
  width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; transition: border-color var(--transition); background: var(--bg); color: var(--text);
}
.auth-form .form-input:focus, .auth-form .form-select:focus { outline: none; border-color: var(--primary); }
.auth-form .btn { width: 100%; padding: 12px; font-size: 15px; justify-content: center; margin-top: 8px; }
.auth-error { color: #E85C5C; font-size: 13px; margin-top: 8px; display: none; }
.auth-info { background: #FFFBE8; border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 16px; font-size: 12px; color: #8C8028; line-height: 1.6; }
.role-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
}
.role-tag.teacher { background: var(--primary-light); color: var(--primary); }
.role-tag.volunteer { background: var(--blue-light); color: var(--blue); }
.role-tag.parent { background: var(--green-light); color: var(--green); }
.role-tag.child { background: var(--yellow-light); color: #C8A52B; }

/* ===== App Layout ===== */
.app-layout { display: none; min-height: 100vh; }
.app-layout.logged-in { display: flex; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; z-index: 100;
  transition: transform var(--transition);
}
.sidebar-logo {
  padding: 24px 20px; font-size: 20px; font-weight: 700; color: var(--primary);
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
}
.sidebar-logo .icon { font-size: 28px; }
.sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 15px; font-weight: 500;
  color: var(--text-secondary); border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .nav-icon { font-size: 20px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto; background: var(--primary); color: #fff; font-size: 11px; padding: 2px 8px;
  border-radius: 10px; font-weight: 600;
}

/* ===== Main ===== */
.main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
.header {
  height: var(--header-h); background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
  position: sticky; top: 0; z-index: 50;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 12px; align-items: center; }
.menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; padding: 4px; color: var(--text); }
.content { flex: 1; padding: 32px; max-width: 1100px; width: 100%; }

/* ===== User Menu ===== */
.user-menu { position: relative; }
.user-trigger {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 24px;
  cursor: pointer; transition: all var(--transition); border: none; background: none; color: var(--text); font-family: inherit;
}
.user-trigger:hover { background: var(--bg); }
.user-trigger-avatar {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-trigger-name { font-size: 13px; font-weight: 600; }
.user-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0; background: var(--card); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); min-width: 200px; padding: 8px; display: none; z-index: 150;
}
.user-dropdown.open { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.user-dropdown-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px;
  font-size: 14px; cursor: pointer; transition: all var(--transition); border: none; background: none;
  width: 100%; text-align: left; color: var(--text); font-family: inherit;
}
.user-dropdown-item:hover { background: var(--bg); }
.user-dropdown-item.danger { color: #E85C5C; }
.user-dropdown-item.danger:hover { background: #FFF0F0; }
.user-dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all var(--transition); border: none; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,145,92,0.35); }
.btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
.btn-danger { background: #FFF0F0; color: #E85C5C; }
.btn-danger:hover { background: #FFE0E0; }

/* ===== Cards ===== */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 24px; transition: all var(--transition); }
.card:hover { box-shadow: var(--shadow); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

/* ===== Stats ===== */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: 16px; transition: all var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.stat-icon.orange { background: var(--primary-light); color: var(--primary); }
.stat-icon.green { background: var(--green-light); color: var(--green); }
.stat-icon.blue { background: var(--blue-light); color: var(--blue); }
.stat-icon.yellow { background: var(--yellow-light); color: #C8A52B; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ===== Child Card ===== */
.child-card {
  background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);
  cursor: pointer; transition: all var(--transition);
}
.child-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.child-cover {
  height: 160px; background: linear-gradient(135deg, var(--primary-light), #FFE0CC);
  display: flex; align-items: center; justify-content: center; font-size: 64px; position: relative;
}
.child-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.child-info { padding: 16px; }
.child-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.child-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.child-desc { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 32px; }
.timeline::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--border); border-radius: 1px; }
.timeline-item { position: relative; margin-bottom: 28px; display: flex; gap: 16px; }
.timeline-dot {
  position: absolute; left: -26px; top: 6px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--primary); border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--primary); z-index: 1;
}
.timeline-dot.photo { background: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
.timeline-dot.milestone { background: var(--green); box-shadow: 0 0 0 2px var(--green); }
.timeline-content { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-sm); flex: 1; }
.timeline-date { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.timeline-title { font-size: 15px; font-weight: 600; margin: 4px 0; }
.timeline-desc { font-size: 13px; color: var(--text-secondary); }
.timeline-media { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.timeline-media img, .timeline-media video {
  width: 120px; height: 120px; object-fit: cover; border-radius: var(--radius-sm);
  cursor: pointer; transition: transform var(--transition);
}
.timeline-media img:hover, .timeline-media video:hover { transform: scale(1.05); }

/* ===== Message Card ===== */
.msg-card { background: var(--card); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow-sm); transition: all var(--transition); }
.msg-card:hover { box-shadow: var(--shadow); }
.msg-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.msg-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0; }
.msg-author { font-weight: 600; font-size: 15px; }
.msg-time { font-size: 12px; color: var(--text-secondary); }
.msg-content { font-size: 14px; line-height: 1.7; color: var(--text); }
.msg-to { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 8px; }
.msg-actions { display: flex; gap: 16px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.msg-action { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: color var(--transition); background: none; border: none; padding: 4px 0; }
.msg-action:hover { color: var(--primary); }
.msg-action.liked { color: #E85C5C; }
.comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.comment-item:last-child { border-bottom: none; }
.comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.comment-body { flex: 1; }
.comment-author { font-size: 13px; font-weight: 600; }
.comment-text { font-size: 13px; color: var(--text); }
.comment-time { font-size: 11px; color: var(--text-secondary); }

/* ===== QA Card ===== */
.qa-card { background: var(--card); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow-sm); }
.qa-badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.qa-badge.student { background: var(--yellow-light); color: #C8A52B; }
.qa-badge.volunteer { background: var(--blue-light); color: var(--blue); }
.qa-title { font-size: 16px; font-weight: 700; margin: 10px 0 6px; }
.qa-content { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.qa-answers { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.qa-answer { background: var(--bg); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; }
.qa-answer-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.qa-answer-text { font-size: 13px; line-height: 1.6; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(61,53,48,0.4); backdrop-filter: blur(4px);
  z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 1;
}
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--bg);
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #fee; color: #e55; }
.modal-body { padding: 24px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; transition: border-color var(--transition); background: var(--bg); color: var(--text);
}
.form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ===== Tabs ===== */
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 24px; }
.tab {
  flex: 1; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; background: none; color: var(--text-secondary); text-align: center;
}
.tab.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius-sm); background: var(--card); box-shadow: var(--shadow-lg);
  font-size: 14px; font-weight: 500; animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 8px;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
.toast.success { border-left: 4px solid var(--green); }
.toast.error { border-left: 4px solid #E85C5C; }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
.empty-state h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 14px; margin-bottom: 20px; }

/* ===== Media Viewer ===== */
.media-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 250; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.media-viewer img, .media-viewer video { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

/* ===== Child Detail ===== */
.child-detail-header { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 32px; }
.child-detail-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, var(--primary-light), #FFE0CC); display: flex; align-items: center; justify-content: center; font-size: 52px; flex-shrink: 0; }
.child-detail-info h2 { font-size: 24px; margin-bottom: 4px; }
.child-detail-info .meta { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }

/* ===== Profile ===== */
.profile-info-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
.profile-info-row + .profile-info-row { border-top: 1px solid var(--border); }
.profile-label { font-size: 13px; color: var(--text-secondary); width: 60px; flex-shrink: 0; }
.profile-value { font-size: 14px; font-weight: 600; }

/* ===== Spinner ===== */
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 12px; color: var(--text-secondary); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .header { padding: 0 16px; }
  .content { padding: 20px 16px; }
  .menu-btn { display: block; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .card-grid { grid-template-columns: 1fr; }
  .child-detail-header { flex-direction: column; align-items: center; text-align: center; }
  .tabs { flex-direction: column; }
  .auth-card { padding: 24px 18px; }
  .user-trigger-name { display: none; }
}
@media (max-width: 480px) {
  .stats-row { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { padding: 14px; gap: 10px; }
  .stat-icon { width: 36px; height: 36px; border-radius: 10px; font-size: 18px; }
  .stat-value { font-size: 22px; }
}
</style>
</head>
<body>

<!-- ===== AUTH PAGE ===== -->
<div class="auth-page" id="authPage">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">🌻</div>
      <h1>山花成长记</h1>
      <p>支教孩子成长记录平台</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">登录</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">注册</button>
      </div>
      <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><label class="form-label">邮箱</label><input class="form-input" type="email" id="loginEmail" placeholder="请输入邮箱" required></div>
        <div class="form-group"><label class="form-label">密码</label><input class="form-input" type="password" id="loginPassword" placeholder="请输入密码" required></div>
        <div class="auth-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
      </form>
      <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group"><label class="form-label">邮箱</label><input class="form-input" type="email" id="regEmail" placeholder="用于登录的邮箱" required></div>
        <div class="form-group"><label class="form-label">密码</label><input class="form-input" type="password" id="regPassword" placeholder="至少6位密码" required minlength="6"></div>
        <div class="form-group"><label class="form-label">显示名称</label><input class="form-input" type="text" id="regName" placeholder="你的真实姓名或昵称" required></div>
        <div class="form-group"><label class="form-label">身份角色</label>
          <select class="form-select" id="regRole"><option value="volunteer">🎓 支教志愿者</option><option value="teacher">👩‍🏫 老师</option><option value="parent">👨‍👩‍👧 家长</option><option value="child">🎒 孩子</option></select>
        </div>
        <div class="auth-error" id="registerError"></div>

<script>
// ============================================================
// SUPABASE CLIENT
// ============================================================
const SUPABASE_URL = 'https://spsxuxpwlhalydzzqmjh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwc3h1eHB3bGhhbHlkenpxbWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MjM3NzQsImV4cCI6MjA5NDQ5OTc3NH0.cqcA_qzBoMzDWDWPJCw-t_pthcjpg_xYofWHFqJmuyg';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// GLOBALS
// ============================================================
const ROLE_LABELS = { teacher: '老师', volunteer: '支教志愿者', parent: '家长', child: '孩子' };
const ROLE_ICONS = { teacher: '👩‍🏫', volunteer: '🎓', parent: '👨‍👩‍👧', child: '🎒' };
const AVATAR_COLORS = ['#E8915C','#5B9A6B','#5B7F9A','#C8A52B','#E85C5C','#8B5CF6'];

let currentUser = null;   // Supabase auth user
let currentProfile = null; // profiles table row
let children = [];
let growthRecords = [];
let messages = [];
let qaPosts = [];
let profiles = []; // cached for display

// ============================================================
// AUTH SYSTEM
// ============================================================
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '登录中...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    errorEl.textContent = error.message === 'Invalid login credentials' ? '邮箱或密码错误' : error.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }
  errorEl.style.display = 'none';
  await onLoginSuccess(data.user);
  btn.disabled = false; btn.textContent = '登 录';
}

async function handleRegister(e) {
  e.preventDefault();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const name = document.getElementById('regName').value.trim();
  const role = document.getElementById('regRole').value;
  const errorEl = document.getElementById('registerError');
  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = '注册中...';

  const { data, error } = await supabase.auth.signUp({
    email, password,
    options: { data: { name, role } }
  });

  if (error) {
    errorEl.textContent = error.message.includes('already registered') ? '该邮箱已被注册' : error.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }

  // If user is immediately signed in (email confirmation disabled)
  if (data.user && data.session) {
    // Create profile
    await supabase.from('profiles').insert({
      id: data.user.id, username: email, name, role,
      avatar_color: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)]
    });
    await onLoginSuccess(data.user);
  } else {
    showToast('注册成功！如开启了邮箱验证，请查收验证邮件后登录。', 'success');
    switchAuthTab('login');
  }
  btn.disabled = false; btn.textContent = '注 册';
  errorEl.style.display = 'none';
}

async function onLoginSuccess(user) {
  currentUser = user;
  // Load profile
  const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
  currentProfile = profile;
  if (!profile) {
    // Auto-create profile from metadata
    const meta = user.user_metadata || {};
    const { data: newProfile } = await supabase.from('profiles').insert({
      id: user.id, username: user.email, name: meta.name || user.email, role: meta.role || 'volunteer',
      avatar_color: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)]
    }).select().single();
    currentProfile = newProfile;
  }
  showApp();
  showToast(`欢迎回来，${currentProfile.name}！`, 'success');
}

async function handleLogout() {
  document.getElementById('userDropdown').classList.remove('open');
  await supabase.auth.signOut();
  currentUser = null;
  currentProfile = null;
  showAuthPage();
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if (tab === 'login') {
    document.querySelector('.auth-tab:first-child').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelector('.auth-tab:last-child').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('registerError').style.display = 'none';
}

function showAuthPage() {
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('appLayout').classList.remove('logged-in');
}

function showApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('appLayout').classList.add('logged-in');
  setupUserMenu();
  render();
}

function setupUserMenu() {
  if (!currentProfile) return;
  document.getElementById('userAvatar').style.background = currentProfile.avatar_color || '#E8915C';
  document.getElementById('userAvatar').textContent = currentProfile.name.charAt(0);
  document.getElementById('userNameDisplay').textContent = currentProfile.name;
  document.getElementById('dropdownRole').innerHTML = `<span class="role-tag ${currentProfile.role}">${ROLE_ICONS[currentProfile.role]} ${ROLE_LABELS[currentProfile.role]}</span>`;
  // Show init demo button only for teacher/volunteer
  document.getElementById('initDemoBtn').style.display = (currentProfile.role === 'teacher' || currentProfile.role === 'volunteer') ? '' : 'none';
}

function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('open'); }

function showProfile() {
  document.getElementById('userDropdown').classList.remove('open');
  const linkedNames = (currentProfile.linked_children || []).map(id => children.find(c => c.id === id)?.name || '').filter(Boolean).join('、') || '无';
  showModal('个人信息', `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <div style="width:56px;height:56px;border-radius:50%;background:${currentProfile.avatar_color};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;">${currentProfile.name.charAt(0)}</div>
      <div><div style="font-weight:700;font-size:17px;">${currentProfile.name}</div><div><span class="role-tag ${currentProfile.role}">${ROLE_ICONS[currentProfile.role]} ${ROLE_LABELS[currentProfile.role]}</span></div></div>
    </div>
    <div class="profile-info-row"><span class="profile-label">邮箱</span><span class="profile-value">${currentProfile.username || currentUser.email}</span></div>
    <div class="profile-info-row"><span class="profile-label">角色</span><span class="profile-value">${ROLE_LABELS[currentProfile.role]}</span></div>
    <div class="profile-info-row"><span class="profile-label">关联孩子</span><span class="profile-value">${linkedNames}</span></div>
    <div class="profile-info-row"><span class="profile-label">加入时间</span><span class="profile-value">${new Date(currentProfile.created_at).toLocaleDateString('zh-CN')}</span></div>
  `, () => {});
}

// ============================================================
// DATA HELPERS
// ============================================================
async function loadAllData() {
  const [cRes, gRes, mRes, qRes, pRes] = await Promise.all([
    supabase.from('children').select('*').order('created_at', { ascending: true }),
    supabase.from('growth_records').select('*').order('date', { ascending: false }),
    supabase.from('messages').select('*').order('created_at', { ascending: false }),
    supabase.from('qa_posts').select('*').order('created_at', { ascending: false }),
    supabase.from('profiles').select('*')
  ]);
  children = cRes.data || [];
  growthRecords = gRes.data || [];
  messages = mRes.data || [];
  qaPosts = qRes.data || [];
  profiles = pRes.data || [];
  // Load answers for each QA post
  for (const qa of qaPosts) {
    const { data: answers } = await supabase.from('qa_answers').select('*').eq('post_id', qa.id).order('created_at', { ascending: true });
    qa.answers = answers || [];
  }
  // Load comments for growth records and messages
  for (const g of growthRecords) {
    const { data: comments } = await supabase.from('comments').select('*').eq('parent_type', 'growth').eq('parent_id', g.id).order('created_at', { ascending: true });
    g.comments = comments || [];
  }
  for (const m of messages) {
    const { data: comments } = await supabase.from('comments').select('*').eq('parent_type', 'message').eq('parent_id', m.id).order('created_at', { ascending: true });
    m.comments = comments || [];
  }
}

// ============================================================
// ROLE HELPERS
// ============================================================
function canManage() { return currentProfile && (currentProfile.role === 'teacher' || currentProfile.role === 'volunteer'); }
function canWriteMessage() { return currentProfile && currentProfile.role !== 'child'; }
function getVisibleChildren() {
  if (!currentProfile) return [];
  if (currentProfile.role === 'parent') return children.filter(c => (currentProfile.linked_children || []).includes(c.id));
  if (currentProfile.role === 'child') return children.filter(c => c.created_by === currentUser.id);
  return children;
}
function canDelete(createdBy) {
  if (!currentProfile) return false;
  if (canManage()) return true;
  return createdBy === currentUser.id;
}

// ================================================================
// ROUTING & RENDERING
// ================================================================
let currentPage = 'home';
const contentEl = document.getElementById('content');
const pageTitle = document.getElementById('pageTitle');
const globalAddBtn = document.getElementById('globalAddBtn');
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');

async function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  sidebar.classList.remove('open');
  await render();
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!sidebar.contains(e.target) && e.target !== menuBtn && sidebar.classList.contains('open')) sidebar.classList.remove('open');
  const um = document.getElementById('userMenu');
  const dd = document.getElementById('userDropdown');
  if (dd && um && !um.contains(e.target)) dd.classList.remove('open');
});

globalAddBtn.addEventListener('click', async () => {
  if (!currentProfile) return;
  if (currentPage === 'children' && canManage()) showAddChildModal();
  else if (currentPage === 'growth' && canManage()) showAddGrowthModal();
  else if (currentPage === 'messages' && canWriteMessage()) showAddMessageModal();
  else if (currentPage === 'qa') showAddQAModal();
  else if (currentPage === 'children' && !canManage()) showToast('你没有管理孩子档案的权限', 'error');
  else if (currentPage === 'growth' && !canManage()) showToast('你没有添加成长记录的权限', 'error');
  else if (currentPage === 'messages' && !canWriteMessage()) showToast('你没有写寄语的权限', 'error');
  else navigate('children');
});

async function render() {
  if (!currentUser) return;
  contentEl.innerHTML = '<div class="loading-overlay"><div class="spinner"></div>加载中...</div>';
  await loadAllData();
  updateBadges();
  updateAddButton();
  updateInitDemoButton();
  switch (currentPage) {
    case 'home': renderHome(); break;
    case 'children': renderChildren(); break;
    case 'growth': renderGrowth(); break;
    case 'messages': renderMessages(); break;
    case 'qa': renderQA(); break;
  }
}

function updateBadges() {
  document.getElementById('childCount').textContent = getVisibleChildren().length;
}

function updateAddButton() {
  const btn = globalAddBtn;
  if (currentPage === 'children') {
    btn.style.display = canManage() ? '' : 'none'; btn.textContent = '+ 添加孩子';
  } else if (currentPage === 'growth') {
    btn.style.display = canManage() ? '' : 'none'; btn.textContent = '+ 添加记录';
  } else if (currentPage === 'messages') {
    btn.style.display = canWriteMessage() ? '' : 'none'; btn.textContent = '+ 写寄语';
  } else if (currentPage === 'qa') {
    btn.style.display = ''; btn.textContent = '+ 提问';
  } else {
    btn.style.display = ''; btn.textContent = '+ 添加记录';
  }
}

function updateInitDemoButton() {
  document.getElementById('initDemoBtn').style.display = (currentProfile && (currentProfile.role === 'teacher' || currentProfile.role === 'volunteer')) ? '' : 'none';
}

// ================================================================
// HOME
// ================================================================
function renderHome() {
  pageTitle.textContent = `欢迎，${currentProfile.name}`;
  const visibleChildren = getVisibleChildren();
  const visibleGrowth = growthRecords.filter(g => visibleChildren.some(c => c.id === g.child_id));
  const totalLikes = [...growthRecords, ...messages, ...qaPosts].reduce((s, r) => s + (r.likes || 0), 0);
  const totalComments = [...growthRecords, ...messages].reduce((s, r) => s + (r.comments || []).length, 0) + qaPosts.reduce((s, q) => s + (q.answers || []).length, 0);

  contentEl.innerHTML = `
    <div style="margin-bottom:24px;font-size:14px;color:var(--text-secondary);">
      当前身份：<span class="role-tag ${currentProfile.role}">${ROLE_ICONS[currentProfile.role]} ${ROLE_LABELS[currentProfile.role]}</span>
      ${currentProfile.role === 'parent' ? ` · 关联：${visibleChildren.map(c => c.name).join('、')}` : ''}
      ${visibleChildren.length === 0 && children.length === 0 ? '<div style="margin-top:12px;background:#FFFBE8;padding:12px;border-radius:8px;">💡 还没有孩子档案，点击上方 <b>🎭 初始化演示数据</b> 按钮自动创建，或手动添加。</div>' : ''}
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon orange">👧</div><div><div class="stat-value">${visibleChildren.length}</div><div class="stat-label">可见孩子</div></div></div>
      <div class="stat-card"><div class="stat-icon green">📸</div><div><div class="stat-value">${visibleGrowth.length}</div><div class="stat-label">成长记录</div></div></div>
      <div class="stat-card"><div class="stat-icon blue">💌</div><div><div class="stat-value">${messages.length}</div><div class="stat-label">寄语祝福</div></div></div>
      <div class="stat-card"><div class="stat-icon yellow">❤️</div><div><div class="stat-value">${totalLikes + totalComments}</div><div class="stat-label">互动总数</div></div></div>
    </div>
    <h3 style="margin-bottom:16px;font-size:16px;">📋 最近动态</h3>
    <div style="display:flex;flex-direction:column;gap:12px;">${getRecentActivity()}</div>
  `;
}

function getRecentActivity() {
  const visibleChildren = getVisibleChildren();
  const items = [];
  growthRecords.filter(g => visibleChildren.some(c => c.id === g.child_id)).slice(0, 3).forEach(g => {
    items.push({ icon: g.type === 'photo' ? '🖼️' : g.type === 'video' ? '🎬' : '🌟', title: `${g.child_name} · ${g.title}`, desc: (g.description || '').slice(0, 40), date: g.date, link: 'growth' });
  });
  messages.slice(0, 2).forEach(m => {
    items.push({ icon: '💌', title: `${m.author} 的寄语`, desc: m.content.slice(0, 40), date: m.date, link: 'messages' });
  });
  qaPosts.slice(0, 1).forEach(q => {
    items.push({ icon: '💬', title: q.title, desc: `${(q.answers || []).length} 个回答`, date: q.date, link: 'qa' });
  });
  return items.length > 0 ? items.map(a => `
    <div class="card" style="padding:16px 20px;display:flex;align-items:center;gap:16px;">
      <div style="font-size:24px;">${a.icon}</div>
      <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${a.title}</div><div style="font-size:12px;color:var(--text-secondary);">${a.desc} · ${a.date}</div></div>
      <button class="btn btn-outline btn-sm" onclick="navigate('${a.link}')">查看</button>
    </div>
  `).join('') : '<div class="empty-state"><div class="empty-icon">🌱</div><h3>一切从这里开始</h3><p>平台数据将实时同步给所有用户</p></div>';
}

// ================================================================
// CHILDREN PAGE
// ================================================================
function renderChildren() {
  pageTitle.textContent = '孩子档案';
  const visibleChildren = getVisibleChildren();
  contentEl.innerHTML = `
    <div class="card-grid">
      ${visibleChildren.map(c => `
        <div class="child-card" onclick="viewChild('${c.id}')">
          <div class="child-cover">${c.avatar ? `<img src="${c.avatar}" alt="${c.name}">` : c.name.charAt(0)}</div>
          <div class="child-info">
            <div class="child-name">${c.name}</div>
            <div class="child-meta"><span>🎂 ${c.age}岁</span><span>📚 ${c.grade}</span></div>
            <div class="child-desc">${c.description || ''}</div>
          </div>
        </div>
      `).join('')}
    </div>
    ${visibleChildren.length === 0 ? `<div class="empty-state"><div class="empty-icon">👧</div><h3>还没有可见的孩子档案</h3><p>${canManage() ? '点击上方按钮添加孩子，或点击"初始化演示数据"' : '请联系老师或志愿者添加孩子档案'}</p></div>` : ''}
  `;
}

async function viewChild(id) {
  const child = children.find(c => c.id === id);
  if (!child) return;
  const visible = getVisibleChildren();
  if (!visible.some(c => c.id === id)) { showToast('你没有权限查看该孩子', 'error'); return; }

  const childGrowth = growthRecords.filter(g => g.child_id === id);
  pageTitle.textContent = child.name;
  updateAddButton();

  const canEdit = canManage();
  contentEl.innerHTML = `
    <div class="child-detail-header">
      <div class="child-detail-avatar">${child.avatar ? `<img src="${child.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : child.name.charAt(0)}</div>
      <div class="child-detail-info">
        <h2>${child.name}</h2>
        <div class="meta">🎂 ${child.age}岁 · 📚 ${child.grade} · 📅 ${child.join_date || ''} 加入</div>
        <p style="font-size:14px;color:var(--text-secondary);line-height:1.7;">${child.description || ''}</p>
        <div style="margin-top:12px;display:flex;gap:8px;">
          ${canEdit ? `<button class="btn btn-outline btn-sm" onclick="editChild('${child.id}')">✏️ 编辑</button>
            <button class="btn btn-sm" style="background:#fee;color:#e55;" onclick="deleteChild('${child.id}')">🗑️ 删除</button>
            <button class="btn btn-primary btn-sm" onclick="showAddGrowthModal('${child.id}')">+ 添加记录</button>` : ''}
        </div>
      </div>
    </div>
    <h3 style="margin-bottom:16px;">📸 成长记录 (${childGrowth.length})</h3>
    ${childGrowth.length > 0 ? `<div class="timeline">
      ${childGrowth.map(g => renderGrowthItem(g, true)).join('')}
    </div>` : '<div class="empty-state"><div class="empty-icon">📸</div><h3>还没有成长记录</h3></div>'}
    <button class="btn btn-primary" style="margin-top:20px;" onclick="navigate('children')">← 返回所有孩子</button>
  `;
}

// ================================================================
// GROWTH PAGE
// ================================================================
function renderGrowth() {
  pageTitle.textContent = '成长点滴';
  updateAddButton();
  const visibleChildren = getVisibleChildren();
  const sorted = growthRecords.filter(g => visibleChildren.some(c => c.id === g.child_id));

  contentEl.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;">
      <select class="form-select" style="width:auto;" id="growthFilter" onchange="filterGrowth()">
        <option value="">👧 全部孩子</option>
        ${visibleChildren.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}

async function toggleLike(type, id) {
  let table, item;
  if (type === 'growth') { table = 'growth_records'; item = growthRecords.find(r => r.id === id); }
  else if (type === 'message') { table = 'messages'; item = messages.find(m => m.id === id); }
  else if (type === 'qa') { table = 'qa_posts'; item = qaPosts.find(q => q.id === id); }
  else return;
  if (!item) return;

  const likedBy = item.liked_by || [];
  const idx = likedBy.indexOf(currentUser.id);
  if (idx >= 0) { likedBy.splice(idx, 1); item.likes = Math.max(0, (item.likes || 0) - 1); }
  else { likedBy.push(currentUser.id); item.likes = (item.likes || 0) + 1; }

  await supabase.from(table).update({ likes: item.likes, liked_by: likedBy }).eq('id', id);
  render();
}

async function toggleLikeAnswer(qaId, answerId) {
  const answer = qaPosts.find(q => q.id === qaId)?.answers?.find(a => a.id === answerId);
  if (!answer) return;
  answer.likes = (answer.likes || 0) + 1;
  await supabase.from('qa_answers').update({ likes: answer.likes }).eq('id', answerId);
  render();
}

function toggleComments(id, type) {
  const el = document.getElementById(`comments-${type}-${id}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleAnswerInput(id) {
  const el = document.getElementById('answerInput-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';

async function addComment(type, parentId) {
  const input = document.getElementById(`commentInput-${type}-${parentId}`);
  if (!input || !input.value.trim()) return;
  await supabase.from('comments').insert({
    parent_type: type, parent_id: parentId,
    author: currentProfile.name, author_id: currentUser.id,
    text: input.value.trim(), date: new Date().toISOString().slice(0, 10)
  });
  render();
  showToast('评论发送成功', 'success');
}

async function addAnswer(qaId) {
  const textInput = document.getElementById(`answerText-${qaId}`);
  if (!textInput || !textInput.value.trim()) return;
  await supabase.from('qa_answers').insert({
    post_id: qaId, author: currentProfile.name, author_id: currentUser.id,
    text: textInput.value.trim(), date: new Date().toISOString().slice(0, 10), likes: 0

}

function viewMedia(url, type) {
  const viewer = document.createElement('div');
  viewer.className = 'media-viewer';
  viewer.innerHTML = type === 'video' ? `<video src="${url}" controls autoplay style="max-width:90vw;max-height:90vh;border-radius:8px;"></video>` : `<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px;">`;
  viewer.addEventListener('click', () => viewer.remove());
  document.body.appendChild(viewer);
}

function showModal(title, bodyHTML, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h2>${title}</h2><button class="modal-close">✕</button></div>
      <div class="modal-body">${bodyHTML}</div>
      <div style="padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-outline btn-sm" id="modalCancel">取消</button>
        <button class="btn btn-primary btn-sm" id="modalSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector('.modal-close').addEventListener('click', close);
  overlay.querySelector('#modalCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelector('#modalSave').addEventListener('click', () => { const r = onSave(overlay); if (r !== false) close(); });
}

function compressImage(file, maxW, maxH, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`; toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

// KEYBOARD
// ================================================================
document.addEventListener('keydown', (e) => {
  if (!currentUser) return;
  if (e.ctrlKey || e.metaKey) {
    switch (e.key) {
      case '1': e.preventDefault(); navigate('home'); break;
      case '2': e.preventDefault(); navigate('children'); break;
      case '3': e.preventDefault(); navigate('growth'); break;
      case '4': e.preventDefault(); navigate('messages'); break;
      case '5': e.preventDefault(); navigate('qa'); break;
    }
  }
  if (e.key === 'Escape') {
    document.querySelector('.modal-overlay')?.remove();
    document.querySelector('.media-viewer')?.remove();
    document.getElementById('userDropdown')?.classList.remove('open');
  }
});

// ================================================================
// INIT
// ================================================================
async function init() {
  // Check for existing session
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
    if (profile) { currentProfile = profile; showApp(); } else { showAuthPage(); }
  } else {
    showAuthPage();
  }
}

// Listen for auth state changes (for OAuth, etc.)
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null; currentProfile = null; showAuthPage();
  }
});
