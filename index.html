<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山花成长记 - 支教孩子成长记录</title>
<style>
/* ===== CSS Variables & Reset ===== */
:root {
  --primary: #E8915C;
  --primary-dark: #D4784A;
  --primary-light: #FFF0E8;
  --green: #5B9A6B;
  --green-light: #E8F5EC;
  --blue: #5B7F9A;
  --blue-light: #E8F0F8;
  --yellow: #E8C75B;
  --yellow-light: #FFFBE8;
  --bg: #FAF7F2;
  --card: #FFFFFF;
  --text: #3D3530;
  --text-secondary: #8C8078;
  --border: #E8E0D8;
  --shadow-sm: 0 1px 3px rgba(61,53,48,0.08);
  --shadow: 0 4px 16px rgba(61,53,48,0.10);
  --shadow-lg: 0 8px 32px rgba(61,53,48,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 220px;
  --header-h: 64px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Login Page ===== */
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #FFF0E8 0%, #FAF7F2 30%, #E8F5EC 70%, #E8F0F8 100%);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.auth-page::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 20% 80%, rgba(232,145,92,0.08) 0%, transparent 50%),
              radial-gradient(circle at 80% 20%, rgba(91,154,107,0.08) 0%, transparent 50%),
              radial-gradient(circle at 50% 50%, rgba(91,127,154,0.05) 0%, transparent 50%);
  animation: authBgFloat 20s ease-in-out infinite;
}
@keyframes authBgFloat {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(1%, -1%); }
  66% { transform: translate(-1%, 1%); }
}
.auth-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
}
.auth-header {
  text-align: center;
  margin-bottom: 28px;
}
.auth-header .logo {
  font-size: 48px;
  margin-bottom: 8px;
}
.auth-header h1 {
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.auth-header p {
  font-size: 14px;
  color: var(--text-secondary);
}
.auth-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 32px 28px;
}
.auth-tabs {
  display: flex;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  background: none;
  color: var(--text-secondary);
  text-align: center;
}
.auth-tab.active {
  background: var(--card);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-form .form-group { margin-bottom: 16px; }
.auth-form .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.auth-form .form-input, .auth-form .form-select {
  width: 100%;
  padding: 11px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  transition: border-color var(--transition);
  background: var(--bg);
  color: var(--text);
}
.auth-form .form-input:focus, .auth-form .form-select:focus {
  outline: none;
  border-color: var(--primary);
}
.auth-form .btn {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  justify-content: center;
  margin-top: 8px;
}
.auth-error {
  color: #E85C5C;
  font-size: 13px;
  margin-top: 8px;
  display: none;
}
.demo-accounts {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.demo-accounts .demo-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.demo-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.demo-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text);
}
.demo-chip:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateY(-1px);
}
.demo-chip .demo-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.role-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.role-tag.teacher { background: var(--primary-light); color: var(--primary); }
.role-tag.volunteer { background: var(--blue-light); color: var(--blue); }
.role-tag.parent { background: var(--green-light); color: var(--green); }
.role-tag.child { background: var(--yellow-light); color: #C8A52B; }

/* ===== Main App Layout (hidden before login) ===== */
.app-layout {
  display: none;
  min-height: 100vh;
}
.app-layout.logged-in { display: flex; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  background: var(--card);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform var(--transition);
}
.sidebar-logo {
  padding: 24px 20px;
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo .icon { font-size: 28px; }
.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-secondary);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .nav-icon { font-size: 20px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

/* ===== Main ===== */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  height: var(--header-h);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.menu-btn {
  display: none;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  padding: 4px;
  color: var(--text);
}
.content {
  flex: 1;
  padding: 32px;
  max-width: 1100px;
  width: 100%;
}

/* ===== User Menu ===== */
.user-menu {
  position: relative;
}
.user-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px 6px 6px;
  border-radius: 24px;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  background: none;
  color: var(--text);
  font-family: inherit;
}
.user-trigger:hover { background: var(--bg); }
.user-trigger-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-trigger-name { font-size: 13px; font-weight: 600; }
.user-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  min-width: 200px;
  padding: 8px;
  display: none;
  z-index: 150;
}
.user-dropdown.open { display: block; animation: fadeIn 0.15s ease; }
.user-dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  color: var(--text);
  font-family: inherit;
}
.user-dropdown-item:hover { background: var(--bg); }
.user-dropdown-item.danger { color: #E85C5C; }
.user-dropdown-item.danger:hover { background: #FFF0F0; }
.user-dropdown-divider {
  height: 1px;
  background: var(--border);
  margin: 6px 0;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,145,92,0.35); }
.btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
.btn-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; font-size: 18px;
  transition: all var(--transition); color: var(--text-secondary);
}
.btn-icon:hover { background: var(--bg); color: var(--primary); }
.btn-icon.liked { color: #E85C5C; }

/* ===== Cards ===== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  transition: all var(--transition);
}
.card:hover { box-shadow: var(--shadow); }
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

/* ===== Stats Row ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.stat-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.stat-icon.orange { background: var(--primary-light); color: var(--primary); }
.stat-icon.green { background: var(--green-light); color: var(--green); }
.stat-icon.blue { background: var(--blue-light); color: var(--blue); }
.stat-icon.yellow { background: var(--yellow-light); color: #C8A52B; }
.stat-value { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ===== Child Card ===== */
.child-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.child-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.child-cover {
  height: 160px;
  background: linear-gradient(135deg, var(--primary-light), #FFE0CC);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  position: relative;
}
.child-cover img {
  width: 100%; height: 100%;
  object-fit: cover;
  position: absolute; top: 0; left: 0;
}
.child-info { padding: 16px; }
.child-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.child-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.child-desc { font-size: 13px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
  content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px;
  width: 2px; background: var(--border); border-radius: 1px;
}
.timeline-item {
  position: relative;
  margin-bottom: 28px;
  display: flex;
  gap: 16px;
}
.timeline-dot {
  position: absolute;
  left: -26px; top: 6px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid var(--card);
  box-shadow: 0 0 0 2px var(--primary);
  z-index: 1;
}
.timeline-dot.photo { background: var(--blue); box-shadow: 0 0 0 2px var(--blue); }
.timeline-dot.milestone { background: var(--green); box-shadow: 0 0 0 2px var(--green); }
.timeline-content {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  flex: 1;
}
.timeline-date { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.timeline-title { font-size: 15px; font-weight: 600; margin: 4px 0; }
.timeline-desc { font-size: 13px; color: var(--text-secondary); }
.timeline-media {
  margin-top: 12px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.timeline-media img, .timeline-media video {
  width: 120px; height: 120px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: transform var(--transition);
}
.timeline-media img:hover, .timeline-media video:hover { transform: scale(1.05); }

/* ===== Message Card ===== */
.msg-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition);
}
.msg-card:hover { box-shadow: var(--shadow); }
.msg-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.msg-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  color: #fff; flex-shrink: 0;
}
.msg-author { font-weight: 600; font-size: 15px; }
.msg-time { font-size: 12px; color: var(--text-secondary); }
.msg-content { font-size: 14px; line-height: 1.7; color: var(--text); }
.msg-to { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 8px; }
.msg-actions {
  display: flex; gap: 16px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.msg-action {
  display: flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer; transition: color var(--transition);
  background: none; border: none; padding: 4px 0;
}
.msg-action:hover { color: var(--primary); }
.msg-action.liked { color: #E85C5C; }
.comments-section { margin-top: 12px; }
.comment-item {
  display: flex; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.comment-item:last-child { border-bottom: none; }
.comment-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.comment-body { flex: 1; }
.comment-author { font-size: 13px; font-weight: 600; }
.comment-text { font-size: 13px; color: var(--text); }
.comment-time { font-size: 11px; color: var(--text-secondary); }

/* ===== QA Card ===== */
.qa-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
}
.qa-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.qa-badge.student { background: var(--yellow-light); color: #C8A52B; }
.qa-badge.volunteer { background: var(--blue-light); color: var(--blue); }
.qa-title { font-size: 16px; font-weight: 700; margin: 10px 0 6px; }
.qa-content { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.qa-answers { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.qa-answer {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.qa-answer-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.qa-answer-text { font-size: 13px; line-height: 1.6; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(61,53,48,0.4);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 90%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; background: var(--card); z-index: 1;
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none; background: var(--bg);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover { background: #fee; color: #e55; }
.modal-body { padding: 24px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  transition: border-color var(--transition);
  background: var(--bg);
  color: var(--text);
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 4px;
  background: var(--bg);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 24px;
}
.tab {
  flex: 1;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition);
  border: none; background: none;
  color: var(--text-secondary);
  text-align: center;
}
.tab.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 24px; right: 24px;
  z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  background: var(--card);
  box-shadow: var(--shadow-lg);
  font-size: 14px; font-weight: 500;
  animation: slideIn 0.3s ease;
  display: flex; align-items: center; gap: 8px;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
.toast.success { border-left: 4px solid var(--green); }

/* ===== Media Viewer ===== */

  position: fixed; inset: 0;

/* ===== Responsive ===== */
@media (max-width: 768px) {

    transform: translateX(-100%);

seedAllData();

// Global data references
let users = loadData('users', []);
let children = loadData('children', []);
let growthRecords = loadData('growth', []);
let messages = loadData('messages', []);
let qaPosts = loadData('qa', []);
let currentUser = null;

function refreshData() {
  users = loadData('users', []);
  children = loadData('children', []);
  growthRecords = loadData('growth', []);
  messages = loadData('messages', []);
  qaPosts = loadData('qa', []);
}

/* ================================================================
   AUTH SYSTEM
   ================================================================ */
function initAuth() {
  // Update linked children dropdown for registration
  updateLinkedChildrenSelect();

  // Render demo account buttons
  renderDemoAccounts();

  // Check session
  const session = loadData('session', null);
  if (session) {
    const user = users.find(u => u.id === session.userId);
    if (user) {
      currentUser = user;
      showApp();
      return;
    }
  }
  showAuthPage();
}

function updateLinkedChildrenSelect() {
  const sel = document.getElementById('regLinkedChild');
  if (!sel) return;
  sel.innerHTML = '<option value="">选择你的孩子</option>' +
    children.map(c => `<option value="${c.id}">${c.name}（${c.grade}）</option>`).join('');
}

function renderDemoAccounts() {
  const container = document.getElementById('demoList');
  if (!container) return;
  container.innerHTML = users.map(u => `
    <div class="demo-chip" onclick="quickLogin('${u.id}')" title="密码: 123456">
      <div class="demo-avatar" style="background:${u.avatarColor};">${u.name.charAt(0)}</div>
      <span>${u.name}</span>
      <span class="role-tag ${u.role}">${ROLE_LABELS[u.role]}</span>
    </div>
  `).join('');
}

function quickLogin(userId) {
  const user = users.find(u => u.id === userId);
  if (user) {
    currentUser = user;
    saveData('session', { userId: user.id });
    showApp();
    showToast(`欢迎回来，${user.name}！`, 'success');
  }
}

function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');

  const user = users.find(u => u.username === username && u.password === password);
  if (!user) {
    errorEl.textContent = '用户名或密码错误，请重试';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';
  currentUser = user;
  saveData('session', { userId: user.id });
  showApp();
  showToast(`欢迎回来，${user.name}！`, 'success');
}

function handleRegister(e) {
  e.preventDefault();
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const name = document.getElementById('regName').value.trim();
  const role = document.getElementById('regRole').value;
  const linkedChild = document.getElementById('regLinkedChild').value;
  const errorEl = document.getElementById('registerError');

  if (users.find(u => u.username === username)) {
    errorEl.textContent = '该用户名已被使用，请换一个';
    errorEl.style.display = 'block';
    return;
  }
  if (role === 'parent' && !linkedChild) {
    errorEl.textContent = '家长需要关联至少一个孩子';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  const newUser = {
    id: genId(),
    username,
    password,
    name,
    role,
    avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
    linkedChildren: role === 'parent' ? [linkedChild] : [],
    linkedChildId: role === 'child' ? linkedChild || undefined : undefined,
    joinDate: new Date().toISOString().slice(0, 10)
  };
  users.push(newUser);
  saveData('users', users);
  currentUser = newUser;
  saveData('session', { userId: newUser.id });
  refreshData();
  showApp();
  showToast(`注册成功！欢迎加入，${name}！`, 'success');
}

function onRegRoleChange() {
  const role = document.getElementById('regRole').value;
  document.getElementById('linkedChildrenGroup').style.display = (role === 'parent' || role === 'child') ? 'block' : 'none';
  if (role === 'parent') {
    document.getElementById('linkedChildrenGroup').querySelector('.form-label').textContent = '关联孩子（家长必选）';
    document.getElementById('linkedChildrenGroup').querySelector('.form-hint').textContent = '家长需要关联至少一个孩子以查看其成长记录';
  } else if (role === 'child') {
    document.getElementById('linkedChildrenGroup').querySelector('.form-label').textContent = '关联孩子档案（可选）';
    document.getElementById('linkedChildrenGroup').querySelector('.form-hint').textContent = '如果你是已建档的孩子，请选择自己的档案';
  }
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if (tab === 'login') {
    document.querySelector('.auth-tab:first-child').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelector('.auth-tab:last-child').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
    updateLinkedChildrenSelect();
  }
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('registerError').style.display = 'none';
}

function handleLogout() {
  if (!confirm('确定要退出登录吗？')) return;
  currentUser = null;
  localStorage.removeItem(STORAGE_KEY + 'session');
  document.getElementById('userDropdown').classList.remove('open');
  showAuthPage();
}

function showAuthPage() {
  document.getElementById('authPage').style.display = 'flex';
  document.getElementById('appLayout').classList.remove('logged-in');
  updateLinkedChildrenSelect();
  renderDemoAccounts();
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
}

function showApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('appLayout').classList.add('logged-in');
  setupUserMenu();
  render();
  updateBadges();
}

function setupUserMenu() {
  if (!currentUser) return;
  document.getElementById('userAvatar').style.background = currentUser.avatarColor;
  document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('dropdownRole').innerHTML =

/* ================================================================
   ROLE-BASED HELPERS
   ================================================================ */
// Users who can manage (create/edit/delete) children and growth records
function canManage() {
  if (!currentUser) return false;
  return currentUser.role === 'teacher' || currentUser.role === 'volunteer';
}

// Users who can write messages
function canWriteMessage() {
  if (!currentUser) return false;
  return currentUser.role !== 'child';
}

// Get children visible to current user
function getVisibleChildren() {
  if (!currentUser) return [];
  if (currentUser.role === 'parent') {
    const linked = currentUser.linkedChildren || [];
    return children.filter(c => linked.includes(c.id));
  }
  if (currentUser.role === 'child' && currentUser.linkedChildId) {
    return children.filter(c => c.id === currentUser.linkedChildId);
  }
  return children; // teacher, volunteer see all
}

// Check if user can delete a specific item
function canDelete(itemCreatedBy) {
  if (!currentUser) return false;
  if (canManage()) return true;
  return itemCreatedBy === currentUser.id;
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ================================================================
   ROUTING & RENDERING
   ================================================================ */
let currentPage = 'home';
const contentEl = document.getElementById('content');
const pageTitle = document.getElementById('pageTitle');
const globalAddBtn = document.getElementById('globalAddBtn');
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');
  sidebar.classList.remove('open');
  render();
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});

menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
document.addEventListener('click', (e) => {
  if (!sidebar.contains(e.target) && e.target !== menuBtn && sidebar.classList.contains('open')) {
    sidebar.classList.remove('open');
  }
  // Close user dropdown on outside click
  const userMenu = document.getElementById('userMenu');
  const dropdown = document.getElementById('userDropdown');
  if (dropdown && userMenu && !userMenu.contains(e.target)) {
    dropdown.classList.remove('open');
  }
});

globalAddBtn.addEventListener('click', () => {
  if (!currentUser) return;
  if (currentPage === 'children' && canManage()) showAddChildModal();
  else if (currentPage === 'growth' && canManage()) showAddGrowthModal();
  else if (currentPage === 'messages' && canWriteMessage()) showAddMessageModal();
  else if (currentPage === 'qa') showAddQAModal();
  else if (currentPage === 'children' && !canManage()) showToast('你没有管理孩子档案的权限', 'error');
  else if (currentPage === 'growth' && !canManage()) showToast('你没有添加成长记录的权限', 'error');
  else if (currentPage === 'messages' && !canWriteMessage()) showToast('你没有写寄语的权限', 'error');
  else navigate('children');
});

function render() {
  if (!currentUser) return;
  refreshData();
  updateBadges();
  updateAddButton();
  switch (currentPage) {
    case 'home': renderHome(); break;
    case 'children': renderChildren(); break;
    case 'growth': renderGrowth(); break;
    case 'messages': renderMessages(); break;
    case 'qa': renderQA(); break;
  }
}

function updateBadges() {
  const visible = getVisibleChildren();
  document.getElementById('childCount').textContent = visible.length;
}

function updateAddButton() {
  const btn = globalAddBtn;
  if (currentPage === 'children') {
    if (canManage()) { btn.textContent = '+ 添加孩子'; btn.style.display = ''; }
    else { btn.style.display = 'none'; }
  } else if (currentPage === 'growth') {
    if (canManage()) { btn.textContent = '+ 添加记录'; btn.style.display = ''; }
    else { btn.style.display = 'none'; }
  } else if (currentPage === 'messages') {
    if (canWriteMessage()) { btn.textContent = '+ 写寄语'; btn.style.display = ''; }
    else { btn.style.display = 'none'; }
  } else if (currentPage === 'qa') {
    btn.textContent = '+ 提问'; btn.style.display = '';
  } else {
    btn.textContent = '+ 添加记录'; btn.style.display = '';
  }
}

        <div class="stat-icon blue">💌</div>

    </div>
  `;
}

function getRecentActivity() {
  const visibleChildren = getVisibleChildren();
  const items = [];
  growthRecords.filter(g => visibleChildren.some(c => c.id === g.childId)).slice(-3).reverse().forEach(g => {
    items.push({
      icon: g.type === 'photo' ? '🖼️' : g.type === 'video' ? '🎬' : '🌟',
      title: `${g.childName} · ${g.title}`,
      desc: g.desc.slice(0, 40) + '...',
      date: g.date, link: 'growth'
    });
  });
  messages.slice(-2).reverse().forEach(m => {
    items.push({
      icon: '💌', title: `${m.author} 的寄语`,
      desc: m.content.slice(0, 40) + '...',
      date: m.date, link: 'messages'
    });
  });
  qaPosts.slice(-1).forEach(q => {
    items.push({
      icon: '💬', title: q.title,
      desc: `${q.answers.length} 个回答`,
      date: q.date, link: 'qa'
    });
  });
  return items.slice(0, 8);
}

function filterGrowth() {
  const childId = document.getElementById('growthFilter')?.value || '';

    const matchType = !type || el.dataset.type === type;
    el.style.display = matchChild && matchType ? '' : 'none';
  });
}

/* ================================================================
   INTERACTIONS — Likes & Comments
   ================================================================ */
function toggleLike(type, id) {
  let arr, key;
  if (type === 'growth') { arr = growthRecords; key = 'growth'; }
  else if (type === 'message') { arr = messages; key = 'messages'; }
  else if (type === 'qa') { arr = qaPosts; key = 'qa'; }
  else return;

  const item = arr.find(r => r.id === id);
  if (!item) return;
  item.likedBy = item.likedBy || [];
  const idx = item.likedBy.indexOf(currentUser.id);
  if (idx >= 0) { item.likedBy.splice(idx, 1); item.likes = Math.max(0, (item.likes||0) - 1); }
  else { item.likedBy.push(currentUser.id); item.likes = (item.likes||0) + 1; }
  saveData(key, arr);
  render();
}

function toggleLikeGrowth(id) { toggleLike('growth', id); }
function toggleLikeMsg(id) { toggleLike('message', id); }
function toggleLikeQA(id) { toggleLike('qa', id); }

function toggleLikeAnswer(qaId, answerId) {
  const qa = qaPosts.find(q => q.id === qaId);
  if (!qa) return;
  const answer = qa.answers.find(a => a.id === answerId);
  if (!answer) return;
  answer.likes = (answer.likes || 0) + 1;
  saveData('qa', qaPosts);
  render();
}

function toggleGrowthComments(id) {
  const el = document.getElementById('growthComments-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function toggleMsgComments(id) {
  const el = document.getElementById('msgComments-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function toggleAnswerInput(id) {
  const el = document.getElementById('answerInput-' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addComment(type, parentId) {
  const input = document.getElementById(`commentInput-${type}-${parentId}`);
  if (!input || !input.value.trim()) return;
  const comment = {
    id: genId(),
    author: currentUser.name,
    authorId: currentUser.id,
    text: input.value.trim(),
    date: new Date().toISOString().slice(0, 10)
  };

  if (type === 'growth') {
    const record = growthRecords.find(r => r.id === parentId);
    if (record) { record.comments = record.comments || []; record.comments.push(comment); saveData('growth', growthRecords); }
  } else if (type === 'message') {
    const msg = messages.find(m => m.id === parentId);
    if (msg) { msg.comments = msg.comments || []; msg.comments.push(comment); saveData('messages', messages); }
  }
  render();
  showToast('评论发送成功', 'success');
}

function addAnswer(qaId) {
  const textInput = document.getElementById(`answerText-${qaId}`);
  if (!textInput || !textInput.value.trim()) return;
  const qa = qaPosts.find(q => q.id === qaId);
  if (!qa) return;
  qa.answers = qa.answers || [];
  qa.answers.push({
    id: genId(),
    author: currentUser.name,
    authorId: currentUser.id,
    text: textInput.value.trim(),
    date: new Date().toISOString().slice(0, 10),
    likes: 0
  });
  saveData('qa', qaPosts);
  render();
  showToast('回答提交成功', 'success');
}

/* ================================================================

function showModal(title, bodyHTML, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      <div style="padding:0 24px 24px;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-outline btn-sm" id="modalCancel">取消</button>
        <button class="btn btn-primary btn-sm" id="modalSave">保存</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('.modal-close').addEventListener('click', close);
  overlay.querySelector('#modalCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  overlay.querySelector('#modalSave').addEventListener('click', () => {
    const result = onSave(overlay);
    if (result !== false) close();
  });
}

    </div>
  `, (overlay) => {
    const childIdVal = overlay.querySelector('#growthChild').value;
    const type = overlay.querySelector('#growthType').value;
    const title = overlay.querySelector('#growthTitle').value.trim();
    const desc = overlay.querySelector('#growthDesc').value.trim();
    const date = overlay.querySelector('#growthDate').value;
    if (!childIdVal || !title) { showToast('请填写完整信息', 'error'); return false; }

    const child = children.find(c => c.id === childIdVal);
    const files = overlay.querySelector('#growthMedia').files;

    const saveRecord = (mediaUrls = []) => {
      growthRecords.push({
        id: genId(), childId: childIdVal, childName: child ? child.name : '',
        date, type, title, desc, media: mediaUrls, likes: 0, likedBy: [], comments: [],
        createdBy: currentUser.id
      });
      saveData('growth', growthRecords);
      render();
      showToast('成长记录已添加', 'success');
    };

    if (files.length > 0) {
      const mediaItems = [];
      let processed = 0;
      Array.from(files).forEach(file => {
        if (file.type.startsWith('image/')) {
          compressImage(file, 800, 800, (dataUrl) => {
            mediaItems.push({ type: 'image', url: dataUrl });
            processed++;
            if (processed === files.length) saveRecord(mediaItems);
          });
        } else {
          mediaItems.push({ type: 'video', url: URL.createObjectURL(file) });
          processed++;
          if (processed === files.length) saveRecord(mediaItems);
        }
      });
    } else {
      saveRecord();
    }
  });
}

/* ================================================================
   UTILITY — Image Compression & Toast
   ================================================================ */
function compressImage(file, maxW, maxH, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
}

document.addEventListener('keydown', (e) => {
  if (!currentUser) return; // Only active when logged in
  if (e.ctrlKey || e.metaKey) {
    switch (e.key) {
      case '1': e.preventDefault(); navigate('home'); break;
      case '2': e.preventDefault(); navigate('children'); break;
      case '3': e.preventDefault(); navigate('growth'); break;
      case '4': e.preventDefault(); navigate('messages'); break;
      case '5': e.preventDefault(); navigate('qa'); break;
    }
  }
  if (e.key === 'Escape') {
    const modal = document.querySelector('.modal-overlay');
    if (modal) modal.remove();
    const viewer = document.querySelector('.media-viewer');
    if (viewer) viewer.remove();
    document.getElementById('userDropdown')?.classList.remove('open');
  }
});

// Prevent form submissions on Enter for auth forms
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const form = e.target.closest('form');
    if (form) {
      e.preventDefault();
      form.dispatchEvent(new Event('submit'));
    }
  }
});
